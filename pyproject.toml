[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-workspace"
version = "0.1.0"
description = "Frozen Qwen future-block probes and collaborative masked diffusion"
requires-python = ">=3.11"
dependencies = ["torch==2.6.0", "transformers==4.51.3", "datasets==3.5.0", "huggingface-hub>=0.30,<1", "numpy>=1.26,<3"]

[project.optional-dependencies]
modal = ["modal[api-proxy-support]==1.6.1"]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[project.scripts]
latent-workspace = "latent_workspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
